import pytest

class StopInfiniteLoop(Exception):
    """Исключение для остановки бесконечного цикла в тестах."""
    pass

@pytest.fixture(autouse=True)
def mock_infinite_loop(monkeypatch):
    """
    Автоматически подменяет обновление экрана, чтобы тест не завис 
    в бесконечном цикле while True.
    """
    def mock_update(*args, **kwargs):
        # Выбрасываем исключение, как только цикл доходит до отрисовки
        raise StopInfiniteLoop

    # Подменяем функцию обновления дисплея в pygame
    import pygame
    monkeypatch.setattr(pygame.display, "update", mock_update)
